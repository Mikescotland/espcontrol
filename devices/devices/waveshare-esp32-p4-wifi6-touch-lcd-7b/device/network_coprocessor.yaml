# =============================================================================
# NETWORK CO-PROCESSOR - WiFi firmware variant
# =============================================================================
# Waveshare ESP32-P4-WIFI6-Touch-LCD-7B uses ESP32-C6 hosted WiFi/BLE over SDIO.
# =============================================================================

esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  sdio_frequency: 20MHz
