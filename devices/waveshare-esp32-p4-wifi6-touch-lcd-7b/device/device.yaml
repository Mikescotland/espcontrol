# ---------------------------------------------------------------------------
# ESPHome core
# ---------------------------------------------------------------------------
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  compile_process_limit: 1
  platformio_options:
    build_flags:
      - "-Wno-deprecated-declarations"
      - "-DESPCONTROL_DISABLE_TODO=1"
      - "-DESPCONTROL_ESPHOME_2026_5_REBUILD=1"
      - "-DESPCONTROL_WAVESHARE_7B_20260605=1"
    build_src_flags:
      - "-Wno-literal-suffix"

  on_boot:
    - priority: 260
      then:
        - if:
            condition:
              lambda: |-
                #ifdef USE_ESP32_CRASH_HANDLER
                return esphome::esp32::crash_handler_has_data();
                #else
                return false;
                #endif
            then:
              - lambda: |-
                  #ifdef USE_ESP32_CRASH_HANDLER
                  esphome::esp32::crash_handler_clear();
                  #endif
                  id(waveshare_7b_safe_mode).mark_successful();
                  global_preferences->sync();
                  ESP_LOGW("waveshare_7b", "Cleared saved crash report before API logging; rebooting once");
              - delay: 500ms
              - lambda: |-
                  App.safe_reboot();

    - priority: 250
      then:
        - lambda: |-
            ESP_LOGI("waveshare_7b", "Waveshare 7B hardware profile active");

    # EspControl needs screen_rotation_ready/screen_rotation_select for grid layout.
    # Do NOT call LVGL runtime rotation on this Waveshare model.
    - priority: -100
      then:
        - lambda: |-
            id(screen_rotation_ready) = true;

# ---------------------------------------------------------------------------
# PSRAM
# ---------------------------------------------------------------------------
psram:
  mode: hex
  speed: 200MHz

# ---------------------------------------------------------------------------
# OTA updates
# ---------------------------------------------------------------------------
ota:
  - platform: esphome
    password: "michal1503"
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
    on_error:
      then:
        - script.execute: show_update_failed

  - platform: http_request
    on_begin:
      then:
        - script.execute: show_update_writing
        - script.wait: show_update_writing
    on_end:
      then:
        - globals.set:
            id: firmware_update_complete_pending
            value: 'true'
        - lambda: 'global_preferences->sync();'
    on_error:
      then:
        - script.execute: show_update_failed

safe_mode:
  id: waveshare_7b_safe_mode

# ---------------------------------------------------------------------------
# Shared infrastructure
# ---------------------------------------------------------------------------
packages:
  core_infra: !include ../../../common/device/core_infra.yaml

# ---------------------------------------------------------------------------
# Power management
# ---------------------------------------------------------------------------
esp_ldo:
  - channel: 3
    id: dsi_phy_enable
    voltage: 2.5V
    adjustable: true

  - channel: 4
    id: sd_card_power
    voltage: 2.7V
    adjustable: true

# ---------------------------------------------------------------------------
# Backlight
# Waveshare 7B uses GPIO32 and inverted PWM.
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO32
    id: gpio_backlight_pwm
    frequency: ${backlight_pwm_frequency}
    inverted: true

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 1.0

    on_turn_on:
      then:
        - if:
            condition:
              lambda: |-
                auto now = panel_time_or_fallback(id(panel_time).now(), id(homeassistant_time).now());
                return (id(espcontrol_app).display().target_source_is(
                            espcontrol::DisplayRequestSource::SCREEN_SCHEDULE) &&
                        id(espcontrol_app).display().target_mode_is(
                            espcontrol::DisplayMode::DISPLAY_OFF)) ||
                       screen_schedule_waiting_for_time(
                         id(screen_schedule_trigger).state,
                         id(schedule_enabled).state,
                         now.is_valid());
            then:
              - script.execute: backlight_force_display_off
            else:
              - if:
                  condition:
                    lambda: |-
                      return id(espcontrol_app).display().current_mode_is(
                          espcontrol::DisplayMode::DISPLAY_OFF);
                  then:
                    - script.execute: screensaver_wake

    on_turn_off:
      then:
        - script.execute: display_backlight_handle_off

# ---------------------------------------------------------------------------
# I2C bus and touchscreen
# GT911 on Waveshare 7B: SDA GPIO07, SCL GPIO08, reset GPIO23.
# With current ESPHome LVGL, do not use touchscreen transform here.
# ---------------------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz
    sda_pullup_enabled: false
    scl_pullup_enabled: false

i2c_device:
  - id: i2cdev1
    address: 0x18
  - id: i2cdev2
    address: 0x32
  - id: i2cdev3
    address: 0x36
  - id: i2cdev4
    address: 0x40

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    reset_pin: GPIO23
    update_interval: 50ms
    transform:
      mirror_x: true
      mirror_y: true
      swap_xy: false
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "Touch x=%d y=%d x_raw=%d y_raw=%d",
                   touch.x, touch.y, touch.x_raw, touch.y_raw);
      - script.execute: screensaver_wake

# ---------------------------------------------------------------------------
# Display
# Do not set rotation here when using LVGL.
# ---------------------------------------------------------------------------
display:
  - platform: mipi_dsi
    id: my_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 1024
      height: 600

# ---------------------------------------------------------------------------
# LVGL base
# Do not set rotation here for this ready-made Waveshare MIPI model,
# because this model already has a predefined orientation in ESPHome.
# ---------------------------------------------------------------------------
lvgl:
  id: main_lvgl
  displays:
    - my_display
  byte_order: little_endian
  touchscreens:
    - touchscreen_id: my_touchscreen

# ---------------------------------------------------------------------------
# Rotation compatibility shim
# EspControl Guition layout code expects these IDs to exist.
# For Waveshare 7B we keep the select so grid code can read it,
# but we do not call lvgl.display.set_rotation.
# ---------------------------------------------------------------------------
script:
  - id: apply_screen_rotation
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("waveshare_7b", "Rotation handled by Waveshare MIPI model; skipping LVGL runtime rotation");

select:
  - platform: template
    name: "${entity_screen_rotation}"
    internal: true
    disabled_by_default: true
    id: screen_rotation_select
    entity_category: config
    icon: "mdi:screen-rotation"
    optimistic: true
    restore_value: true
    initial_option: "180"
    options:
      - "0"
      - "90"
      - "180"
      - "270"
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return id(screen_rotation_ready);
            then:
              - script.execute: refresh_button_grid
